<!-- covers: css.properties.table-layout css.properties.empty-cells css.properties.vertical-align -->
<!-- variant: narrow columns=30 -->
<style>
  table { table-layout: fixed; width: 40ch; margin-bottom: 1 }
  td { border: 1px solid }
  .first { width: 8ch }
  .collapse { border-collapse: collapse }
  .auto { width: auto; max-width: none; table-layout: fixed }
  .hide { empty-cells: hide; width: auto; table-layout: auto }
  .hide td { background: #1e3a8a }
  .valign td { border: 1px solid }
  .valign .top { vertical-align: top }
  .valign .bottom { vertical-align: bottom }
</style>
