<!-- covers: css.properties.-webkit-text-fill-color -->
<style>
  .card { color: red; -webkit-text-fill-color: lime; border: 1px solid; outline: 1px dashed }
  .current { color: blue; -webkit-text-fill-color: currentcolor }
  .alone { -webkit-text-fill-color: yellow }
</style>
<div class="card">Lime text in a red border and outline<p>Inherited: lime too</p></div>
<p class="current">currentcolor: blue</p>
<p class="alone">Without color: yellow</p>
