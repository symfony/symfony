<!-- covers: html.elements.img html.elements.figure css.properties.caption-side -->
<style>
  img { border: 1px solid }
  figure { display: table; border: 1px solid; border-bottom: 0; border-collapse: collapse; float: right; margin: 0 0 0 2ch }
  figcaption { display: table-caption; caption-side: bottom; border: 1px solid; border-top: 0; padding: 0 1ch }
</style>
<figure><a href="#xterm"><img src="xterm.png" width="300" height="169"></a><figcaption>xterm, a terminal emulator</figcaption></figure>
<p>An image without a text alternative that is not drawn, <img src="icon.png" width="20" height="20"> like a thumbnail not loaded, leaves nothing: no border around no text, and a figure of it and its caption is the box of the caption.</p>
