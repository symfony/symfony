name: Shell Completion Tests

on:
  push:
    paths:
      - '.github/workflows/shell-completion-tests.yml'
      - 'src/Symfony/Component/Console/Resources/completion.*'
      - 'src/Symfony/Component/Console/Command/CompleteCommand.php'
      - 'src/Symfony/Component/Console/Command/DumpCompletionCommand.php'
      - 'src/Symfony/Component/Console/Completion/**'
      - 'src/Symfony/Component/Console/Tests/shell-completion/**'
  pull_request:
    paths:
      - '.github/workflows/shell-completion-tests.yml'
      - 'src/Symfony/Component/Console/Resources/completion.*'
      - 'src/Symfony/Component/Console/Command/CompleteCommand.php'
      - 'src/Symfony/Component/Console/Command/DumpCompletionCommand.php'
      - 'src/Symfony/Component/Console/Completion/**'
      - 'src/Symfony/Component/Console/Tests/shell-completion/**'

defaults:
  run:
    shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

permissions:
  contents: read

jobs:

  tests:
    name: Shell Completion Tests

    strategy:
      matrix:
        shell: ['bash', 'zsh', 'fish']
      fail-fast: false

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: "none"
          ini-values: date.timezone=UTC,memory_limit=-1
          php-version: "8.4"

      - name: Install the shell
        run: sudo apt-get install -y --no-install-recommends bash-completion ${{ matrix.shell }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress
        working-directory: src/Symfony/Component/Console

      - name: Run tests
        run: src/Symfony/Component/Console/Tests/shell-completion/run.sh ${{ matrix.shell }}
