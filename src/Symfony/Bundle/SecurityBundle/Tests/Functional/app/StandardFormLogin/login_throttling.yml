imports:
    - { resource: ./base_config.yml }

framework:
    lock: ~
    rate_limiter: ~

services:
    app.rate_limit_exceeded_collector:
        class: Symfony\Bundle\SecurityBundle\Tests\Functional\Bundle\FormLoginBundle\EventListener\RateLimitExceededCollector
        public: true
        tags:
            - { name: kernel.event_listener, event: Symfony\Component\RateLimiter\Event\RateLimitExceededEvent, method: onRateLimitExceeded }

security:
    firewalls:
        default:
            login_throttling:
                max_attempts: 1
                interval: '8 minutes'
