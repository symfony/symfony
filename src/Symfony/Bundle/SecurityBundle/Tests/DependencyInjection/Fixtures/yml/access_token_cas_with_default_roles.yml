security:
    firewalls:
        with_string:
            access_token:
                token_handler:
                    cas:
                        validation_url: 'https://www.example.com/cas/serviceValidate'
                default_roles: 'ROLE_FOO'

        with_array:
            access_token:
                token_handler:
                    cas:
                        validation_url: 'https://www.example.com/cas/serviceValidate'
                default_roles: ['ROLE_FOO', 'ROLE_BAR']
