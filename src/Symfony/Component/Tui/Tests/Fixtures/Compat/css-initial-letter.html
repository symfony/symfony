<style>
  p { max-width: 40ch; margin-bottom: 1 }
  .three::first-letter { initial-letter: 3; color: cyan }
  .two::first-letter { initial-letter: 2 1; font-weight: bold }
  .five::first-letter { initial-letter: 5 raise }
  .quote::first-letter { initial-letter: 3 }
</style>
<p class="three">Once upon a time, in a terminal far away, a paragraph started with a drop cap three lines tall, its text beside it.</p>
<p class="two">Two lines: the letter alone, its lines kept, with one line sunk.</p>
<p class="five">Short.</p>
<p class="quote">“Punctuation goes with the letter.</p>
