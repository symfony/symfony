<!-- covers: css.properties.box-sizing -->
<style>
  .box { width: 20ch; height: 4; padding: 0 1ch; border: 1px solid; margin-bottom: 1 }
  .content { box-sizing: content-box }
</style>
<div class="box"><p>border-box: 20 by 4, all in</p></div>
<div class="box content"><p>content-box: 20 by 4 inside</p></div>
