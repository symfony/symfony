<style>
  ul { padding-left: 2ch; margin: 0 0 1 }
  .block { display: block }
  .row { display: flex; justify-content: space-between; width: 30ch }
  .badge { background: blue; color: white; padding: 0 1ch }
</style>
<ul><li>A list item has a marker</li><li class="block">a block has none, like a list group</li></ul>
