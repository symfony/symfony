<!-- covers: css.properties.height -->
<style>
  * { box-sizing: border-box }
  input { block-size: 30px; border: 1px solid; padding: 4px 1ch; width: 30ch }
  .tight { height: 2; border: 1px solid; width: 30ch }
  .short { height: 16px; border: 1px solid; width: 30ch }
</style>
<input value="A field of 30px shows its value">
<div class="tight">two rows: the borders alone</div>
<div class="short">16px: no room for a line</div>
