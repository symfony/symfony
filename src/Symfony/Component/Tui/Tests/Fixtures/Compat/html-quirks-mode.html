<html><body>
<!-- A page without a doctype is in quirks mode, like Hacker News: its tables do not inherit the alignment and the font of the text around them -->
<center><table border="1" width="60%"><tr><td>a cell of a centered table, its text on the left</td></tr></table></center>
<table border="1"><tr><th><table><tr><td>a nested table in a header cell, not bold</td></tr></table></th></tr></table>
<p style="text-align: right">Text outside the tables keeps its alignment</p>
</body></html>
