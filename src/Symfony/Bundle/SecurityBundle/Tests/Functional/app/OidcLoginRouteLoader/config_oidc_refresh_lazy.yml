imports:
    - { resource: ./../config/framework.yml }

framework:
    http_client: ~

security:
    providers:
        in_memory:
            memory:
                users:
                    john: { password: test, roles: [ROLE_USER] }

    firewalls:
        oidc:
            pattern: ^/oidc
            provider: in_memory
            lazy: true
            oidc_login:
                provider_uri: 'https://accounts.example.com'
                client_id: client_id
                client_authentication:
                    client_secret_post: client_secret
                refresh_access_token: true
        main:
            http_basic: ~
            stateless: true

    access_control:
        - { path: ^/oidc/start, roles: ROLE_USER }
