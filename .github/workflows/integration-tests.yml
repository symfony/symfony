name: Integration

on:
  push: { branches: [ '*.*' ] }
  pull_request:

defaults:
  run:
    shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

permissions:
  contents: read

jobs:

  tests:
    name: Integration
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php: ['8.4']
      fail-fast: false

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 13306:3306
        env:
          MYSQL_ROOT_PASSWORD: 'password'
          MYSQL_DATABASE: 'messenger'
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: 'password'
      ldap:
        image: bitnamilegacy/openldap # zizmor: ignore[unpinned-images]
        ports:
          - 3389:3389
        env:
          LDAP_ADMIN_USERNAME: admin
          LDAP_ADMIN_PASSWORD: symfony
          LDAP_ROOT: dc=symfony,dc=com
          LDAP_PORT_NUMBER: 3389
          LDAP_USERS: a
          LDAP_PASSWORDS: a
      ftp:
        image: onekilo79/ftpd_test # zizmor: ignore[unpinned-images]
        ports:
          - 21:21
          - 30000-30009:30000-30009
        volumes:
          - ./:/hostmount
      redis:
        image: redis:6.2.8
        ports:
          - 16379:6379
      redis-authenticated:
        image: redis:6.2.8
        ports:
          - 16380:6379
        env:
          REDIS_ARGS: "--requirepass p@ssword"
      redis-cluster:
        image: grokzen/redis-cluster:6.2.8
        ports:
          - 7000:7000
          - 7001:7001
          - 7002:7002
          - 7003:7003
          - 7004:7004
          - 7005:7005
          - 7006:7006
        env:
          STANDALONE: 1
      redis-sentinel:
        image: bitnamilegacy/redis-sentinel:6.2.8
        ports:
          - 26379:26379
        env:
          REDIS_MASTER_HOST: redis
          REDIS_MASTER_SET: redis_sentinel
          REDIS_SENTINEL_QUORUM: 1
      redis-primary:
        image: bitnamilegacy/redis:latest # zizmor: ignore[unpinned-images]
        ports:
          - 16381:6379
        env:
          ALLOW_EMPTY_PASSWORD: "yes"
          REDIS_REPLICATION_MODE: "master"
        options: >-
          --name=redis-primary
      redis-replica:
        image: bitnamilegacy/redis:latest # zizmor: ignore[unpinned-images]
        ports:
          - 16382:6379
        env:
          ALLOW_EMPTY_PASSWORD: "yes"
          REDIS_REPLICATION_MODE: "slave"
          REDIS_MASTER_HOST: redis-primary
          REDIS_MASTER_PORT_NUMBER: "6379"
        options: >-
          --name=redis-replica
      memcached:
        image: memcached:1.6.5
        ports:
          - 11211:11211
      rabbitmq:
        image: rabbitmq:3.8.3
        ports:
          - 5672:5672
      mongodb:
        image: mongo # zizmor: ignore[unpinned-images]
        ports:
          - 27017:27017
      couchbase:
        image: couchbase:6.5.1
        ports:
          - 8091:8091
          - 8092:8092
          - 8093:8093
          - 8094:8094
          - 11210:11210
      aws:
        image: localstack/localstack:3.0.2
        ports:
          - 4566:4566
      zookeeper:
        image: zookeeper # zizmor: ignore[unpinned-images]
      kafka:
        image: bitnamilegacy/kafka:3.7
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: false
          ALLOW_PLAINTEXT_LISTENER: 'yes'
          KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://127.0.0.1:9092'
          KAFKA_CFG_LISTENERS: 'PLAINTEXT://:9092'
          KAFKA_CFG_ZOOKEEPER_CONNECT: 'zookeeper:2181'
        options: --name=kafka
      frankenphp:
        image: dunglas/frankenphp:1.12.1-php8.4
        ports:
          - 80:80
          - 8681:81
          - 8682:82
          - 8683:83
          - 8684:84
        volumes:
          - ${{ github.workspace }}:/symfony
        env:
          SERVER_NAME: 'http://localhost http://localhost:81 http://localhost:82 http://localhost:83 http://localhost:84'
          CADDY_SERVER_EXTRA_DIRECTIVES: |
            route /http-client* {
              root * /symfony/src/Symfony/Component/HttpClient/Tests/Fixtures/response-functional/
              php_server
            }

            root * /symfony/src/Symfony/Component/HttpFoundation/Tests/Fixtures/response-functional/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Init Kafka topics
        run: |
          docker exec kafka /opt/bitnami/kafka/bin/kafka-topics.sh --create --topic test-topic --bootstrap-server kafka:9092

      - name: Install system dependencies
        run: |
          echo "::group::apt-get update"
          sudo wget -O - https://packages.couchbase.com/clients/c/repos/deb/couchbase.key | sudo apt-key add -
          echo "deb https://packages.couchbase.com/clients/c/repos/deb/ubuntu2404 noble noble/main" | sudo tee /etc/apt/sources.list.d/couchbase.list
          sudo apt-get update
          echo "::endgroup::"

          echo "::group::install tools & libraries"
          sudo apt-get install librdkafka-dev redis-server libcouchbase-dev
          sudo -- sh -c 'echo unixsocket /var/run/redis/redis-server.sock >> /etc/redis/redis.conf'
          sudo -- sh -c 'echo unixsocketperm 777 >> /etc/redis/redis.conf'
          sudo service redis-server restart
          echo "::endgroup::"

      - name: Install pgbouncer
        run: |
          sudo apt-get install -y pgbouncer
          sudo cp src/Symfony/Component/Messenger/Bridge/Doctrine/Tests/Fixtures/pgbouncer/pgbouncer.ini /etc/pgbouncer/pgbouncer.ini
          sudo cp src/Symfony/Component/Messenger/Bridge/Doctrine/Tests/Fixtures/pgbouncer/userlist.txt /etc/pgbouncer/userlist.txt
          sudo service pgbouncer restart
          sudo su - postgres -c "PGPASSWORD=password psql -Atq -h localhost -p 5432 -U postgres -d postgres -c \"SELECT usename, passwd FROM pg_shadow\""

      - name: Configure Couchbase
        run: |
          curl -s -u 'username=Administrator&password=111111@' -X POST http://localhost:8091/node/controller/setupServices -d 'services=kv%2Cn1ql%2Cindex%2Cfts'
          curl -s -X POST http://localhost:8091/settings/web -d 'username=Administrator&password=111111%40&port=SAME'
          curl -s -u Administrator:111111@ -X POST http://localhost:8091/pools/default/buckets -d 'ramQuotaMB=100&bucketType=ephemeral&name=cache'
          curl -s -u Administrator:111111@ -X POST http://localhost:8091/pools/default -d 'memoryQuota=256'

      - name: Create FTP fixtures
        run: |
          mkdir -p ./ftpusers/test/pub
          touch ./ftpusers/test/pub/example ./ftpusers/test/readme.txt

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: "none"
          extensions: "json,couchbase-3.2.2,memcached,mongodb,redis,rdkafka,xsl,ldap,relay"
          ini-values: date.timezone=UTC,memory_limit=-1,default_socket_timeout=10,session.gc_probability=0,apc.enable_cli=1,zend.assertions=1,intl.default_locale=en,intl.error_level=0
          php-version: "${{ matrix.php }}"
          tools: pecl

      - name: Display versions
        run: |
          php -r 'foreach (get_loaded_extensions() as $extension) echo $extension . " " . phpversion($extension) . PHP_EOL;'
          php -i

      - name: Load fixtures
        uses: docker://bitnamilegacy/openldap@sha256:687f14a22b5c74fb057a57221acdbe7b8c82e2d3619fc380db3af48ec4aa04ed # latest
        with:
          entrypoint: /bin/bash
          args: -c "(/opt/bitnami/openldap/bin/ldapwhoami -H ldap://ldap:3389 -D cn=admin,dc=symfony,dc=com -w symfony||sleep 5) && /opt/bitnami/openldap/bin/ldapadd -H ldap://ldap:3389 -D cn=admin,dc=symfony,dc=com -w symfony -f src/Symfony/Component/Ldap/Tests/Fixtures/data/fixtures.ldif && /opt/bitnami/openldap/bin/ldapdelete -H ldap://ldap:3389 -D cn=admin,dc=symfony,dc=com -w symfony cn=a,ou=users,dc=symfony,dc=com"

      - name: Install dependencies
        run: |
          COMPOSER_HOME="$(composer config home)"
          ([ -d "$COMPOSER_HOME" ] || mkdir "$COMPOSER_HOME") && cp .github/composer-config.json "$COMPOSER_HOME/config.json"
          export COMPOSER_ROOT_VERSION=$(grep ' VERSION = ' src/Symfony/Component/HttpKernel/Kernel.php | grep -P -o '[0-9]+\.[0-9]+').x-dev
          echo COMPOSER_ROOT_VERSION=$COMPOSER_ROOT_VERSION >> $GITHUB_ENV

          echo "::group::composer update"
          composer require --dev --no-update "mongodb/mongodb:^2.1@stable"
          composer update --no-progress --ansi
          echo "AMP_SQL_MYSQL_DSN=amp-mysql://root:password@127.0.0.1:13306/messenger" >> $GITHUB_ENV
          echo "AMP_SQL_POSTGRES_DSN=amp-postgres://postgres:password@127.0.0.1:5432/postgres" >> $GITHUB_ENV
          echo "::endgroup::"

          echo "::group::install phpunit"
          ./phpunit install
          echo "::endgroup::"

      - name: Check for changes in translation files
        id: changed-translation-files
        run: |
          echo 'changed='$((git diff --quiet HEAD~1 HEAD -- 'src/**/Resources/translations/*.xlf' || (echo 'true' && exit 1)) && echo 'false') >> $GITHUB_OUTPUT

      - name: Check Translation Status
        if: steps.changed-translation-files.outputs.changed == 'true'
        run: |
          php src/Symfony/Component/Translation/Resources/bin/translation-status.php -v
          php .github/sync-translations.php
          git diff --exit-code src/ || (echo '::error::Run "php .github/sync-translations.php" to fix XLIFF files.' && exit 1)

      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - name: Start PyKMIP
        run: |
          fixture="$RUNNER_TEMP/pykmip"
          src/Symfony/Component/KeyManagement/Bridge/Kmip/Tests/Fixtures/pykmip/generate-certs.sh "$fixture"
          docker run -d --name kmip-server -p 127.0.0.1:5696:5696 \
            -v "$fixture/certs:/kmip/certs:ro" \
            -v "$fixture/data:/kmip/data" \
            -v "$fixture/policies:/kmip/policies:ro" \
            -v "$fixture/server.conf:/kmip/server.conf:ro" \
            --entrypoint pykmip-server \
            biska/pykmip@sha256:b8790203e68ee512fc8d5d9e7ebaec137aae29d8a4683be5f6563131d770e36c \
            -f /kmip/server.conf -l /tmp/server.log
          ready=0
          for attempt in {1..20}; do
            if timeout 15 env KMIP_TEST_HOST=127.0.0.1 KMIP_TEST_PORT=5696 KMIP_TEST_PEER_NAME=localhost \
              KMIP_TEST_CA="$fixture/certs/ca.crt" KMIP_TEST_CERT="$fixture/certs/client.crt" KMIP_TEST_KEY="$fixture/certs/client.key" \
              KMIP_TEST_SERVER=pykmip KMIP_TEST_REQUIRED=1 \
              ./phpunit src/Symfony/Component/KeyManagement/Bridge/Kmip/Tests/KmipIntegrationTest.php \
              --filter testServerAdvertisesSupportedVersion --fail-on-empty-test-suite > "$RUNNER_TEMP/kmip-pykmip-readiness.log" 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/kmip-pykmip-readiness.log"
            docker ps -a --filter name=kmip-server
            docker exec kmip-server cat /tmp/server.log || true
            exit 1
          fi
          echo "KMIP_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "KMIP_TEST_PORT=5696" >> "$GITHUB_ENV"
          echo "KMIP_TEST_PEER_NAME=localhost" >> "$GITHUB_ENV"
          echo "KMIP_TEST_CA=$fixture/certs/ca.crt" >> "$GITHUB_ENV"
          echo "KMIP_TEST_CERT=$fixture/certs/client.crt" >> "$GITHUB_ENV"
          echo "KMIP_TEST_KEY=$fixture/certs/client.key" >> "$GITHUB_ENV"
          echo "KMIP_TEST_OTHER_CERT=$fixture/certs/other.crt" >> "$GITHUB_ENV"
          echo "KMIP_TEST_OTHER_KEY=$fixture/certs/other.key" >> "$GITHUB_ENV"
          echo "KMIP_TEST_NO_EKU_CERT=$fixture/certs/no-eku.crt" >> "$GITHUB_ENV"
          echo "KMIP_TEST_NO_EKU_KEY=$fixture/certs/no-eku.key" >> "$GITHUB_ENV"
          echo "KMIP_TEST_ENCRYPTED_KEY=$fixture/certs/client-encrypted.key" >> "$GITHUB_ENV"
          echo "KMIP_TEST_KEY_PASSPHRASE=test-passphrase" >> "$GITHUB_ENV"
          echo "KMIP_TEST_SERVER=pykmip" >> "$GITHUB_ENV"
          echo "KMIP_TEST_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./phpunit --group integration --exclude-group kmip-integration
        env:
          INTEGRATION_FTP_URL: 'ftp://test:test@localhost'
          LOCK_DYNAMODB_DSN: "dynamodb://localhost:4566/lock_keys?sslmode=disable"
          REDIS_HOST: 'localhost:16379'
          REDIS_AUTHENTICATED_HOST: 'localhost:16380'
          REDIS_CLUSTER_HOSTS: 'localhost:7000 localhost:7001 localhost:7002 localhost:7003 localhost:7004 localhost:7005'
          REDIS_SENTINEL_HOSTS: 'unreachable-host:26379 localhost:26379 localhost:26379'
          REDIS_SENTINEL_SERVICE: redis_sentinel
          REDIS_REPLICATION_HOSTS: 'localhost:16382 localhost:16381'
          MESSENGER_REDIS_DSN: redis://127.0.0.1:7006/messages
          MESSENGER_REDIS_SENTINEL_MASTER: redis_sentinel
          MESSENGER_AMQP_DSN: amqp://localhost/%2f/messages
          MESSENGER_SQS_DSN: "sqs://localhost:4566/messages?sslmode=disable&poll_timeout=0.01"
          MESSENGER_SQS_FIFO_QUEUE_DSN: "sqs://localhost:4566/messages.fifo?sslmode=disable&poll_timeout=0.01"
          MONGODB_URI: 'mongodb://localhost:27017'
          AWS_ENDPOINT_URL: "http://localhost:4566"
          KAFKA_BROKER: 127.0.0.1:9092
          POSTGRES_HOST: localhost
          PGBOUNCER_HOST: localhost:6432
          MYSQL_DSN: mysql:host=localhost
          MYSQL_HOST: 127.0.0.1
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: root

      - name: Run KMIP integration tests
        run: |
          tests=$(./phpunit --group kmip-integration --list-tests)
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"1.4"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"2.0"' <<< "$tests"
          ./phpunit --group kmip-integration --fail-on-empty-test-suite

      - name: Stop PyKMIP
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" != 'success' ]]; then
            docker exec kmip-server cat /tmp/server.log || true
          fi
          docker rm -f kmip-server || true

      - name: Start Eviden KMS
        run: |
          fixture="$RUNNER_TEMP/eviden"
          mkdir -p "$fixture/data"
          docker run -d --name kmip-eviden -p 127.0.0.1:5696:5696 \
            -v "$RUNNER_TEMP/pykmip/certs:/kmip/certs:ro" \
            -v "$fixture/data:/kmip/data" \
            ghcr.io/cosmian/kms:5.27.1 \
            --database-type sqlite --sqlite-path /kmip/data \
            --tls-cert-file /kmip/certs/server.crt --tls-key-file /kmip/certs/server.key \
            --clients-ca-cert-file /kmip/certs/ca.crt --socket-server-start
          ready=0
          for attempt in {1..20}; do
            if timeout 15 env KMIP_TEST_HOST=127.0.0.1 KMIP_TEST_PORT=5696 KMIP_TEST_PEER_NAME=localhost \
              KMIP_TEST_CA="$RUNNER_TEMP/pykmip/certs/ca.crt" KMIP_TEST_CERT="$RUNNER_TEMP/pykmip/certs/client.crt" KMIP_TEST_KEY="$RUNNER_TEMP/pykmip/certs/client.key" \
              KMIP_TEST_SERVER=eviden KMIP_TEST_REQUIRED=1 \
              ./phpunit src/Symfony/Component/KeyManagement/Bridge/Kmip/Tests/KmipIntegrationTest.php \
              --filter testServerAdvertisesSupportedVersion --fail-on-empty-test-suite > "$RUNNER_TEMP/kmip-eviden-readiness.log" 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/kmip-eviden-readiness.log"
            docker ps -a --filter name=kmip-eviden
            docker logs kmip-eviden --tail 200 || true
            exit 1
          fi
          echo "KMIP_TEST_SERVER=eviden" >> "$GITHUB_ENV"

      - name: Run Eviden KMIP integration tests
        run: |
          tests=$(./phpunit --group kmip-integration --list-tests)
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"1.4"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"2.0"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"2.1"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"1.4 ChaCha20-Poly1305"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"2.0 ChaCha20-Poly1305"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"2.1 ChaCha20-Poly1305"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"1.4 AES-GCM-SIV"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"2.0 AES-GCM-SIV"' <<< "$tests"
          grep -Fq 'KmipIntegrationTest::testVersionedOperations"2.1 AES-GCM-SIV"' <<< "$tests"
          ./phpunit --group kmip-integration --fail-on-empty-test-suite

      - name: Stop Eviden KMS
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" != 'success' ]]; then
            docker logs kmip-eviden --tail 200 || true
          fi
          docker rm -f kmip-eviden || true
