<!-- covers: css.properties.interactivity -->
<style>
  .busy { interactivity: inert; opacity: 0.5 }
  .back { interactivity: auto }
</style>
<div class="busy">
  <p>The form is busy: its buttons take neither the focus nor clicks.</p>
  <button>Inert</button>
  <button class="back">Takes the focus back</button>
</div>
<button>Interactive</button>
