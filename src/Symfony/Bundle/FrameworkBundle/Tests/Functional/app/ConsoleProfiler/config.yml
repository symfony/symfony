imports:
    - { resource: ../config/default.yml }

framework:
    http_method_override: false
    profiler:
        enabled: true
        collect: true

services:
    public_profiler:
        alias: profiler
        public: true

    stop_command_listener:
        class: Symfony\Bundle\FrameworkBundle\Tests\Functional\app\ConsoleProfiler\StopCommandListener
        public: true
        tags:
            - { name: kernel.event_listener, event: console.command }
