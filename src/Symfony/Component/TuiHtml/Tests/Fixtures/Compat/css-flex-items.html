<!-- variant: narrow columns=30 -->
<style>
  nav { display: flex; gap: 1ch; justify-content: space-between }
  nav > * { flex: none }
  nav > a { color: blue }
  nav > .active { font-weight: bold }
  nav > a::before { content: "[" } nav > a::after { content: "]" }
  .tags { display: flex; gap: 1ch }
  .tags > span { flex: none; background: gray }
  @media (max-width: 40ch) { .responsive { display: flex } }
  .inherits { display: inherit; gap: inherit }
  .wide-block { display: flex; gap: 1ch } @media (min-width: 41ch) { .wide-block { display: block } }
</style>

  <div class="wide-block">a block when wide: <b>one</b> line, <button>OK</button> too</div>
