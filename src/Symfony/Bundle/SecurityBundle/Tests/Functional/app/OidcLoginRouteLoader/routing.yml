# mirrors what the routing recipe ships for every application
_security_oidc_login:
    resource: security.authenticator.oidc_login.route_loader
    type: service

_security_logout:
    resource: security.route_loader.logout
    type: service

# only the shared-context configuration registers the controller behind it
_admin_protected:
    path: /admin/protected
    defaults: { _controller: Symfony\Bundle\SecurityBundle\Tests\Functional\Bundle\EventBundle\Controller\ProtectedController::__invoke }
