imports:
    - { resource: ./../config/default.yml }

security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext

    providers:
        in_memory:
            memory:
                users:
                    johannes: { password: test, roles: [ROLE_USER] }

    firewalls:
        login_form:
            pattern: ^/login$
            security: false

        default:
            form_login:
                check_path: /login_check
                default_target_path: /profile
            logout: ~
            lazy: true

        # the templates the FormLoginBundle renders build a logout URL for it
        second_area:
            http_basic: ~
            logout:
                target: /second/target
                path: /second/logout

    access_control:
        - { path: ^/protected_resource$, roles: IS_AUTHENTICATED_RECENTLY }
        - { path: .*, roles: IS_AUTHENTICATED_FULLY }
