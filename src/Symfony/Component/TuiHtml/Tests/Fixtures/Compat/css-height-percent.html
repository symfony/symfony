<!-- covers: css.properties.height css.properties.min-height css.properties.max-height -->
<!-- variant: short rows=12 -->
<style>
  main { height: 100%; display: flex; flex-direction: column }
  .top { height: 25%; border: 1px solid }
  .box { height: 6; border: 1px solid }
  .half { height: 50%; background: blue }
  .auto > .ignored { height: 50%; background: green }
  .capped { max-height: 10%; border: 1px solid }
</style>
<main>
  <header class="top">25% of the screen, borders included</header>
  <div class="box"><p class="half">half of a fixed height</p></div>
  <div class="auto"><p class="ignored">ignored: the parent has no definite height</p></div>
  <p class="capped">at most 10% of the screen<br>two<br>three<br>four</p>
</main>
