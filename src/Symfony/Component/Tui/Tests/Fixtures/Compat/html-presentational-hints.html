<style>.overridden { text-align: left }</style>
<p align="center">Centered by its align attribute</p>
<p align="center" class="overridden">A CSS rule wins over the attribute</p>
<textarea cols="24" aria-label="Notes">24 columns wide</textarea>
<input size="12" aria-label="Short" value="12 chars">
<textarea rows="1" aria-label="Fixed">One line shown

<textarea rows="1" aria-label="Grows" style="field-sizing: content">field-sizing: content

<textarea cols="24" wrap="off" aria-label="Unwrapped">wrap="off": this line stays on one row</textarea>
<table width="400" border="1" bgcolor="#1f2937">

</table>
<div style="display: flex; justify-content: space-between"><input placeholder="20 characters by default"><span>beside it, not squeezed</span></div>

<table border="1" cellspacing="4"><tr><td>cellspacing</td><td>keeps the cells apart</td></tr></table>
