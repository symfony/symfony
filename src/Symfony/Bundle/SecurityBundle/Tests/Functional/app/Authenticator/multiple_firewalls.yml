imports:
- { resource: ./config.yml }
- { resource: ./security.yml }

security:
    erase_credentials: false
    firewalls:
        firewall1:
            pattern: /firewall1
            provider: in_memory
            form_login:
                check_path: /firewall1/login
        firewall2:
            pattern: /firewall2
            provider: in_memory2
            form_login:
                check_path: /firewall2/login
